name: Build and Deploy to Sealos

# 每次向 main 分支推送 → 构建镜像并推送到 GHCR → 滚动更新 Sealos 上的应用
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'agent-config/**'
  workflow_dispatch:

# 同一分支只保留最新一次部署，避免并发滚动更新互相干扰
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. 构建并推送镜像到 GHCR ────────────────────────────────
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Sealos 节点为 amd64
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # 密钥文件绝不进入构建上下文（.dockerignore 已排除，此处再兜底校验）
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify no secrets were baked into the image
        run: |
          set -euo pipefail
          echo "构建上下文中的敏感文件检查（.dockerignore 生效性）："
          if [ -f .env ]; then
            echo "::notice::工作区存在 .env，但 .dockerignore 已排除，不会进入镜像"
          fi
          grep -q '^\.env$' .dockerignore || { echo "::error::.dockerignore 未排除 .env"; exit 1; }

  # ── 2. 滚动更新 Sealos 上的工作负载 ─────────────────────────
  deploy:
    name: Roll out on Sealos
    needs: build
    runs-on: ubuntu-latest
    # 首次部署（模板尚未创建 StatefulSet）时该步骤会安全跳过
    steps:
      - name: Configure Sealos kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.SEALOS_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_B64}" ]; then
            echo "::warning::未配置 SEALOS_KUBECONFIG secret，跳过部署步骤"
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.kube
          printf '%s' "${KUBECONFIG_B64}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Roll out new image
        if: env.SKIP_DEPLOY != '1'
        env:
          NS: ${{ vars.SEALOS_NAMESPACE }}
          APP: ${{ vars.SEALOS_APP_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${NS:-}" ] || [ -z "${APP:-}" ]; then
            echo "::warning::未配置 SEALOS_NAMESPACE / SEALOS_APP_NAME 仓库变量，跳过部署"
            exit 0
          fi

          kubectl config set-context --current --namespace="$NS"

          if ! kubectl get statefulset "$APP" >/dev/null 2>&1; then
            echo "::warning::StatefulSet $APP 尚不存在（首次部署未完成），跳过滚动更新"
            exit 0
          fi

          IMAGE="${IMAGE}:${GITHUB_SHA}"
          echo "更新 $NS/$APP → $IMAGE"

          # Launchpad 创建的是 StatefulSet；直接 set image 触发滚动更新
          kubectl set image "statefulset/$APP" "$APP=$IMAGE"

          kubectl rollout status "statefulset/$APP" --timeout=420s

          echo "### 部署完成 :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- 镜像: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 工作负载: \`$NS/$APP\`" >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -l "app=$APP" -o wide >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
